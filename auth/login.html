<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Miyabi-Suki</title>
    <link rel="icon" href="/img/icons/favicon.ico">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-bg">
    <div class="auth-glow one"></div>
    <div class="auth-glow two"></div>
</div>

<main class="auth-page">
    <section class="auth-card">

        <div class="auth-logo">
            <img src="/img/icons/favicon.ico" alt="Miyabi-Suki">
        </div>

        <span class="auth-tag">MIYABI-SUKI</span>
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">
            Enter the world of Hoyoverse fans.
        </p>

        <form class="auth-form" id="loginForm">

            <div class="input-group">
                <label for="email">EMAIL</label>
                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                    id="password"
                    type="password"
                    placeholder="Your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                class="auth-button"
                id="loginBtn"
                type="submit"
            >
                Login
            </button>

            <div
                class="auth-message"
                id="loginMessage"
            ></div>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="/auth/register.html">Create one</a>
        </div>

        <a class="back-home" href="/">
            ← Back to Home
        </a>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>

<script>
document.getElementById('loginForm').addEventListener('submit',async(event) => {
    event.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const button = document.getElementById('loginBtn');
    const message = document.getElementById('loginMessage');

    button.disabled = true;
    button.textContent = 'Logging in...';
    message.className = 'auth-message';
    message.textContent = '';

    const result = await loginUser(email,password);

    if(!result.success) {
        message.className = 'auth-message error';
        message.textContent = result.message;
        button.disabled = false;
        button.textContent = 'Login';
        return;
    }

    message.className = 'auth-message success';
    message.textContent = 'Welcome back!';

    setTimeout(() => {
        window.location.href = '/';
    },700);
});
</script>

</body>
</html>
