<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Miyabi-Suki</title>
    <link rel="icon" href="/img/icons/favicon.ico">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body>

<div class="auth-bg">
    <div class="auth-glow one"></div>
    <div class="auth-glow two"></div>
</div>

<main class="auth-page">
    <section class="auth-card">

        <div class="auth-logo">
            <img src="/img/icons/favicon.ico" alt="Miyabi-Suki">
        </div>

        <span class="auth-tag">MIYABI-SUKI</span>
        <h1 class="auth-title">Join the Hub</h1>
        <p class="auth-subtitle">
            Create your identity in the Hoyoverse community.
        </p>

        <form class="auth-form" id="registerForm">

            <div class="input-group">
                <label for="username">USERNAME</label>
                <input
                    id="username"
                    type="text"
                    placeholder="MiyabiFan"
                    minlength="3"
                    maxlength="32"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="email">EMAIL</label>
                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                    id="password"
                    type="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="input-group">
                <label for="passwordConfirm">CONFIRM PASSWORD</label>
                <input
                    id="passwordConfirm"
                    type="password"
                    placeholder="Repeat your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button
                class="auth-button"
                id="registerBtn"
                type="submit"
            >
                Create Account
            </button>

            <div
                class="auth-message"
                id="registerMessage"
            ></div>

        </form>

        <div class="auth-footer">
            Already have an account?
            <a href="/auth/login.html">Login</a>
        </div>

        <a class="back-home" href="/">
            ← Back to Home
        </a>

    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>

<script>
document.getElementById('registerForm').addEventListener('submit',async(event) => {
    event.preventDefault();

    const username = document.getElementById('username').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('passwordConfirm').value;
    const button = document.getElementById('registerBtn');
    const message = document.getElementById('registerMessage');

    message.className = 'auth-message';
    message.textContent = '';

    if(password !== confirmPassword) {
        message.className = 'auth-message error';
        message.textContent = 'Passwords do not match.';
        return;
    }

    button.disabled = true;
    button.textContent = 'Creating Account...';

    const result = await registerUser(
        email,
        password,
        username
    );

    if(!result.success) {
        message.className = 'auth-message error';
        message.textContent = result.message;
        button.disabled = false;
        button.textContent = 'Create Account';
        return;
    }

    message.className = 'auth-message success';
    message.textContent = 'Account created! Welcome to Miyabi-Suki.';

    setTimeout(() => {
        window.location.href = '/';
    },900);
});
</script>

</body>
</html>
