<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Miyabi-Suki</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="icon" href="img/icons/favicon.ico">
    <style>
        body {
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#020817;
        }
        .auth-container {
            width:100%;
            max-width:430px;
            padding:20px;
        }
        .auth-card {
            background:rgba(10,15,35,0.92);
            border:1px solid var(--border-light);
            border-radius:20px;
            padding:35px;
            box-shadow:0 20px 60px rgba(0,0,0,0.45);
            backdrop-filter:blur(12px);
        }
        .auth-title {
            text-align:center;
            margin-bottom:8px;
            color:var(--text-heading);
            font-size:32px;
        }
        .auth-subtitle {
            text-align:center;
            color:var(--text-muted);
            margin-bottom:30px;
        }
        .form-group {
            margin-bottom:18px;
        }
        .form-group label {
            display:block;
            margin-bottom:7px;
            color:var(--text-secondary);
            font-size:14px;
        }
        .form-group input {
            width:100%;
            box-sizing:border-box;
            padding:13px 15px;
            border-radius:10px;
            border:1px solid var(--border-light);
            background:rgba(0,0,0,0.3);
            color:var(--text-heading);
            outline:none;
            font-size:15px;
        }
        .form-group input:focus {
            border-color:var(--border-color);
        }
        .register-btn {
            width:100%;
            padding:13px;
            border:0;
            border-radius:10px;
            background:var(--btn-primary-bg);
            color:white;
            font-size:15px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }
        .register-btn:hover {
            background:var(--btn-primary-hover);
            transform:translateY(-2px);
        }
        .register-btn:disabled {
            opacity:0.6;
            cursor:not-allowed;
            transform:none;
        }
        .message {
            display:none;
            margin-top:15px;
            padding:11px 13px;
            border-radius:9px;
            font-size:14px;
            text-align:center;
        }
        .message.error {
            display:block;
            background:rgba(255,60,60,0.12);
            border:1px solid rgba(255,60,60,0.3);
            color:#ff8585;
        }
        .message.success {
            display:block;
            background:rgba(60,255,150,0.1);
            border:1px solid rgba(60,255,150,0.3);
            color:#72ffb0;
        }
        .auth-footer {
            text-align:center;
            margin-top:22px;
            color:var(--text-muted);
            font-size:14px;
        }
        .auth-footer a {
            color:var(--text-heading-span);
            text-decoration:none;
            font-weight:bold;
        }
        .back-home {
            display:block;
            text-align:center;
            margin-top:18px;
            color:var(--text-muted);
            text-decoration:none;
            font-size:13px;
        }
        .back-home:hover {
            color:var(--text-heading);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="auth-card">

        <h1 class="auth-title">✦ Join Miyabi-Suki ✦</h1>
        <p class="auth-subtitle">Create your Hoyoverse fan account</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="MiyabiFan"
                    minlength="3"
                    maxlength="32"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="At least 6 characters"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="passwordConfirm">Confirm Password</label>
                <input
                    type="password"
                    id="passwordConfirm"
                    name="passwordConfirm"
                    placeholder="Repeat your password"
                    minlength="6"
                    autocomplete="new-password"
                    required
                >
            </div>

            <button type="submit" class="register-btn" id="registerBtn">
                Create Account
            </button>

        </form>

        <div class="message" id="registerMessage"></div>

        <div class="auth-footer">
            Already have an account?
            <a href="/auth/login.html">Login</a>
        </div>

        <a href="/" class="back-home">← Back to Home</a>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/auth.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {

    const form = document.getElementById('registerForm');
    const button = document.getElementById('registerBtn');
    const message = document.getElementById('registerMessage');

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const passwordConfirm = document.getElementById('passwordConfirm').value;

        message.className = 'message';
        message.textContent = '';

        if (password !== passwordConfirm) {
            message.className = 'message error';
            message.textContent = 'Passwords do not match.';
            return;
        }

        button.disabled = true;
        button.textContent = 'Creating Account...';

        try {
            const result = await registerUser(
                email,
                password,
                username
            );

            if (!result.success) {
                message.className = 'message error';
                message.textContent = result.message;
                return;
            }

            message.className = 'message success';
            message.textContent = 'Account created successfully! Redirecting...';

            setTimeout(() => {
                window.location.href = '/';
            }, 1000);

        } catch (error) {
            console.error('Registration failed:', error);

            message.className = 'message error';
            message.textContent = 'Something went wrong. Please try again.';

        } finally {
            button.disabled = false;
            button.textContent = 'Create Account';
        }
    });

});
</script>

</body>
</html>
