<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Miyabi-Suki</title>
    <link rel="icon" href="/img/icons/favicon.ico">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

<div class="profile-bg">
    <div class="bg-grid"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-particle particle-1">✦</div>
    <div class="bg-particle particle-2">✧</div>
    <div class="bg-particle particle-3">◇</div>
</div>

<main class="profile-page">

    <a href="/" class="back-home">
        <span>←</span>
        Back to Home
    </a>

    <section class="profile-card">

        <div class="profile-banner">
            <div class="banner-lines"></div>

            <div class="banner-content">
                <span>MIYABI-SUKI</span>
                <small>HOYOVERSE FAN NETWORK</small>
            </div>

            <div class="banner-symbol">✦</div>
        </div>

        <div class="profile-body">

            <div class="avatar-area">

                <div class="avatar-ring ring-outer"></div>
                <div class="avatar-ring ring-inner"></div>

                <div class="avatar-wrapper">
                    <img
                        id="profileAvatar"
                        src="/img/icons/default-avatar.png"
                        alt="Profile Avatar"
                    >

                    <label
                        for="avatarInput"
                        class="avatar-edit"
                        title="Change avatar"
                    >
                        ✎
                    </label>

                    <input
                        type="file"
                        id="avatarInput"
                        accept="image/jpeg,image/png,image/webp"
                        hidden
                    >
                </div>

                <div class="online-badge">
                    <span></span>
                    ONLINE
                </div>

            </div>

            <div class="profile-header">

                <div class="profile-title">
                    <span class="member-tag">
                        ✦ MIYABI-SUKI MEMBER
                    </span>

                    <h1 id="profileUsername">
                        Loading...
                    </h1>

                    <p id="profileEmail">
                        Loading...
                    </p>
                </div>

                <div class="profile-actions">
                    <button
                        class="action-btn edit-btn"
                        id="editProfileBtn"
                    >
                        ✎ Edit Profile
                    </button>

                    <button
                        class="action-btn logout-btn"
                        id="logoutBtn"
                    >
                        ⇥ Logout
                    </button>
                </div>

            </div>

            <div class="profile-grid">

                <div class="profile-panel about-panel">
                    <div class="panel-heading">
                        <span class="panel-icon">✦</span>
                        <span>ABOUT ME</span>
                    </div>

                    <p id="profileBio">
                        No bio yet.
                    </p>
                </div>

                <div class="profile-panel stats-panel">

                    <div class="stat-box">
                        <span class="stat-icon">👤</span>
                        <div>
                            <small>Username</small>
                            <strong id="infoUsername">—</strong>
                        </div>
                    </div>

                    <div class="stat-box">
                        <span class="stat-icon">✉</span>
                        <div>
                            <small>Email</small>
                            <strong id="infoEmail">—</strong>
                        </div>
                    </div>

                    <div class="stat-box">
                        <span class="stat-icon">◷</span>
                        <div>
                            <small>Joined</small>
                            <strong id="profileJoined">—</strong>
                        </div>
                    </div>

                    <div class="stat-box">
                        <span class="stat-icon">⚡</span>
                        <div>
                            <small>Status</small>
                            <strong>Active</strong>
                        </div>
                    </div>

                </div>

            </div>

            <div class="profile-footer">

                <div class="footer-line"></div>

                <div class="footer-content">
                    <span>✦</span>
                    <p>Made for Hoyoverse Fans</p>
                    <span>✦</span>
                </div>

            </div>

            <div
                id="uploadStatus"
                class="upload-status"
            ></div>

        </div>

    </section>

</main>

<div
    class="modal-overlay"
    id="editModal"
>
    <div class="edit-modal">

        <button
            class="modal-close"
            id="closeModalBtn"
            type="button"
        >
            ×
        </button>

        <div class="modal-header">
            <span>✦ PROFILE SETTINGS</span>
            <h2>Edit Profile</h2>
            <p>Customize your Miyabi-Suki identity.</p>
        </div>

        <form id="editProfileForm">

            <div class="input-group">
                <label for="editUsername">
                    USERNAME
                </label>

                <input
                    type="text"
                    id="editUsername"
                    maxlength="32"
                    autocomplete="off"
                    required
                >
            </div>

            <div class="input-group">
                <label for="editBio">
                    BIO
                </label>

                <textarea
                    id="editBio"
                    maxlength="160"
                    rows="5"
                    placeholder="Tell us something about yourself..."
                ></textarea>

                <div class="character-count">
                    <span id="bioCount">0</span>/160
                </div>
            </div>

            <div class="modal-actions">

                <button
                    type="button"
                    class="modal-btn cancel-btn"
                    id="cancelEditBtn"
                >
                    Cancel
                </button>

                <button
                    type="submit"
                    class="modal-btn save-btn"
                    id="saveProfileBtn"
                >
                    Save Changes
                </button>

            </div>

        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/js/supabase.js"></script>
<script src="/js/profile.js"></script>

</body>
</html>
