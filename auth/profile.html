<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — Miyabi-Suki</title>
    <link rel="icon" href="/img/icons/favicon.ico">
    <link rel="stylesheet" href="/css/profile.css">
</head>
<body>

    <div class="background"></div>

    <main class="profile-page">

        <a href="/" class="back-home">← Back to Home</a>

        <section class="profile-card">

            <div class="profile-cover">
                <div class="cover-glow"></div>
            </div>

            <div class="profile-content">

                <div class="avatar-section">

                    <div class="avatar-wrapper">
                        <img
                            id="profileAvatar"
                            src="/img/icons/default-avatar.png"
                            alt="Profile Avatar"
                        >

                        <label for="avatarInput" class="avatar-edit">
                            ✎
                        </label>

                        <input
                            type="file"
                            id="avatarInput"
                            accept="image/jpeg,image/png,image/webp"
                            hidden
                        >
                    </div>

                    <div class="avatar-status">
                        <span></span>
                        Online
                    </div>

                </div>

                <div class="profile-main">

                    <div class="profile-heading">
                        <div>
                            <span class="profile-label">MIYABI-SUKI MEMBER</span>
                            <h1 id="profileUsername">Loading...</h1>
                            <p id="profileEmail">Loading...</p>
                        </div>

                        <button id="logoutBtn" class="logout-btn">
                            Logout
                        </button>
                    </div>

                    <div class="bio-box">
                        <span class="bio-label">ABOUT ME</span>
                        <p id="profileBio">No bio yet.</p>
                    </div>

                    <div class="profile-info">

                        <div class="info-item">
                            <span class="info-icon">👤</span>
                            <div>
                                <small>Username</small>
                                <strong id="infoUsername">—</strong>
                            </div>
                        </div>

                        <div class="info-item">
                            <span class="info-icon">✉️</span>
                            <div>
                                <small>Email</small>
                                <strong id="infoEmail">—</strong>
                            </div>
                        </div>

                        <div class="info-item">
                            <span class="info-icon">📅</span>
                            <div>
                                <small>Joined</small>
                                <strong id="profileJoined">—</strong>
                            </div>
                        </div>

                    </div>

                    <div id="uploadStatus" class="upload-status"></div>

                </div>

            </div>

        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/supabase.js"></script>
    <script src="/js/profile.js"></script>

</body>
</html>
